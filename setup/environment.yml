name: deitel-openai
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.14
  - jupyterlab>=4.6
  - ipykernel>=7.3
  - numpy>=2.5          # numeric examples in the Agents SDK notebooks
  - pandas>=3.0         # data analysis tasks generated by Codex/agents
  - scipy>=1.18         # scientific computing tasks
  - scikit-learn>=1.9   # machine learning examples generated by Codex/agents
  - statsmodels>=0.15   # statistical modeling tasks
  - matplotlib>=3.11    # plotting and visualization
  - seaborn>=0.13       # statistical visualization
  - plotly>=7.0         # interactive visualization
  - openpyxl>=3.1       # Excel file support for pandas
  - pillow>=12.3        # image processing support
  - wordcloud>=1.9      # word-cloud coding demos
  - requests>=2.34      # HTTP examples generated by Codex/agents
  - beautifulsoup4>=4.15 # HTML parsing / scraping examples
  - lxml>=6.1           # fast XML/HTML parsing backend
  - spacy>=3.8          # NLP examples generated by Codex/agents
  - nltk>=3.10          # NLP/text analysis examples
  - graphviz            # Graphviz executable for Agents SDK graph visualizations
  - python-graphviz>=0.21 # Python bindings for Graphviz
  - pytest>=9.1         # testing support
  - pip
  - pip:
    # Floors below match the versions this course was last verified against.
    # The realtime extra installs the WebSocket support GPT-Live needs
    # (client.live, used by 02-05-10). GPT-Live requires openai 3.x.
    - "openai[realtime]>=3.13"
    # openai-agents is 0.x, where a MINOR bump may break the API. The upper
    # bound keeps students on the release the Part 2 notebooks were written
    # for. Raise both numbers together after re-running the 02-* notebooks.
    # openai-agents 0.22 requires openai>=3.0,<4.
    # The [litellm] extra is omitted: every current LiteLLM release requires
    # openai<3, which conflicts with openai 3.x. 02-05-09 (LiteLLM) uses the
    # separate deitel-openai-litellm environment: see environment-litellm.yml.
    - "openai-agents>=0.22,<0.23"
    # mcp 2.0 renamed FastMCP to MCPServer. 02-05-06 writes a server that
    # must use the 2.x import; pin <2 only if reverting that notebook.
    - "mcp>=2.1"
    - "yfinance>=1.7"             # 02-05-01 financial research agent
    - "playwright>=1.61"          # browser automation (02-05-07)
    - "pydantic>=2.13"            # structured outputs and MCP tool parameter metadata
    - "sounddevice>=0.5.6"        # microphone/speaker audio for the 02-05-10 voice demo
