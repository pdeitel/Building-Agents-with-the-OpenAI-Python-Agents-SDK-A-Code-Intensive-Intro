name: deitel-openai-agents
channels:
  - conda-forge
  # nodefaults keeps conda from adding Anaconda's "defaults" channels, which
  # require accepting Anaconda's Terms of Service and can stop a scripted
  # install with CondaToSNonInteractiveError. Everything here is on conda-forge.
  - nodefaults
dependencies:
  # Python 3.14 only: LiteLLM (02-05-09) does not support Python 3.15 yet
  - python>=3.14,<3.15
  - jupyterlab>=4.6
  - ipykernel>=7.3
  # numpy, pandas, requests, beautifulsoup4 and lxml are yfinance dependencies
  # (02-05-01); listing them here installs conda-forge builds instead of pip's
  - numpy>=2.5
  - pandas>=3.0
  - requests>=2.34
  - beautifulsoup4>=4.15
  - lxml>=6.1
  - graphviz            # Graphviz executable for Agents SDK graph visualizations
  - python-graphviz>=0.21 # Python bindings for Graphviz
  - pip
  - pip:
    # Floors below match the versions this course was last verified against.
    # The realtime extra installs the WebSocket support GPT-Live needs
    # (client.live, used by 02-05-10). GPT-Live requires openai 3.x.
    - "openai[realtime]>=3.42"
    # openai-agents is 0.x, where a MINOR bump may break the API. The upper
    # bound keeps students on the release the Part 2 notebooks were tested
    # with. Raise both numbers together after re-running the 02-* notebooks.
    # openai-agents 0.24 requires openai>=3.0,<4.
    # The [litellm] extra adds LiteLLM for 02-05-09. LiteLLM 1.108.0 is the
    # first release that allows openai 3.x. Until 1.108.0 is released, pin its
    # release candidate; then change the pin to litellm>=1.108.
    - "openai-agents[litellm]>=0.24,<0.25"
    - "litellm==1.108.0rc1"
    # mcp 2.0 renamed FastMCP to MCPServer. 02-05-06 writes a server that
    # must use the 2.x import; pin <2 only if reverting that notebook.
    - "mcp>=2.3"
    - "yfinance>=1.7"             # 02-05-01 financial research agent
    - "playwright>=1.61"          # browser automation (02-05-07)
    - "pydantic>=2.13"            # structured outputs and MCP tool parameter metadata
    - "sounddevice>=0.5.6"        # microphone/speaker audio for the 02-05-10 voice demo
